name: cake_sale_app
description: A production-ready online cake ordering application.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.1.0
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^9.0.0
  razorpay_flutter: ^1.3.5
  crypto: ^3.0.3
  firebase_core: ^2.24.0
  firebase_messaging: ^14.7.0
  firebase_auth: ^4.15.3
  intl: ^0.18.0
  geolocator: ^10.1.0
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/.env
